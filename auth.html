<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Serverless Modern</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Animasi Kustom untuk Keperluan Interaktif */
        .fade-in-slow {
            animation: fadeIn 1s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; background-color: #0b0f19; }
            to { opacity: 1; background-color: #f3f4f6; }
        }
        .switch-glow:hover {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center font-sans overflow-hidden transition-colors duration-1000" id="mainBody">

    <!-- STAGE 1: SAKLAR UTAMA (EFEK MATI LAMPU) -->
    <div id="switchContainer" class="flex flex-col items-center justify-center transition-all duration-700 scale-100">
        <p class="text-slate-400 mb-6 text-sm tracking-widest uppercase animate-pulse">Nyalakan Aplikasi</p>
        <button onclick="turnOnSystem()" id="powerBtn" class="switch-glow w-24 h-24 bg-slate-900 border-2 border-slate-700 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 text-slate-500 hover:text-blue-500 hover:border-blue-500 active:scale-95 shadow-lg">
            <i class="fa-solid fa-power-off text-3xl transition-transform duration-300"></i>
        </button>
    </div>

    <!-- STAGE 2: CONTAINER UTAMA APLIKASI (LOGIN & REGISTER) -->
    <div id="appContainer" class="hidden opacity-0 w-full max-w-md p-4 transition-all duration-500">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden relative min-h-[580px] p-8 flex flex-col justify-center">
            
            <!-- FORM LOGIN -->
            <div id="loginForm" class="transition-all duration-500 transform translate-x-0 opacity-100">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md shadow-blue-200">
                        <i class="fa-solid fa-shield-halved text-white text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Selamat Datang Kembali</h2>
                    <p class="text-sm text-slate-500 mt-1">Silakan masuk ke akun Anda</p>
                </div>

                <form onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner" placeholder="name@company.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold rounded-xl text-sm shadow-lg shadow-blue-200 hover:shadow-xl transition-all cursor-pointer">
                        Masuk Sistem
                    </button>
                </form>

                <div class="text-center mt-8 text-sm text-slate-500">
                    Belum punya akun? 
                    <button onclick="switchForm('register')" class="text-blue-600 font-semibold hover:underline ml-1 cursor-pointer">Daftar sekarang</button>
                </div>
            </div>

            <!-- FORM REGISTRASI -->
            <div id="registerForm" class="hidden transition-all duration-500 transform translate-x-full opacity-0 absolute inset-x-8 top-8 bottom-8 flex flex-col justify-center">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md shadow-emerald-200">
                        <i class="fa-solid fa-user-plus text-white text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Buat Akun Baru</h2>
                    <p class="text-sm text-slate-500 mt-1">Bergabunglah bersama kami hari ini</p>
                </div>

                <form onsubmit="handleRegister(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nama Lengkap</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-regular fa-user"></i>
                            </span>
                            <input type="text" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all shadow-inner" placeholder="John Doe">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all shadow-inner" placeholder="name@company.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all shadow-inner" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-200 hover:shadow-xl transition-all cursor-pointer">
                        Mulai Registrasi
                    </button>
                </form>

                <div class="text-center mt-6 text-sm text-slate-500">
                    Sudah punya akun? 
                    <button onclick="switchForm('login')" class="text-emerald-600 font-semibold hover:underline ml-1 cursor-pointer">Login di sini</button>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 1. Animasi Saklar ON (Mati Lampu -> Terang Berlahan 1 Detik)
        function turnOnSystem() {
            const body = document.getElementById('mainBody');
            const switchContainer = document.getElementById('switchContainer');
            const appContainer = document.getElementById('appContainer');

            // Efek klik tombol saklar
            document.getElementById('powerBtn').classList.add('scale-90', 'bg-blue-600', 'text-white', 'border-blue-400');
            
            // Hilangkan saklar secara bersamaan dengan memudarkan (efek transisi)
            switchContainer.classList.add('opacity-0', 'scale-75');
            
            setTimeout(() => {
                switchContainer.classList.add('hidden');
                
                // Terang perlahan (1 detik) mengubah background body
                body.classList.remove('bg-slate-950');
                body.classList.add('fade-in-slow');
                
                // Tampilkan halaman login utama
                appContainer.classList.remove('hidden');
                setTimeout(() => {
                    appContainer.classList.remove('opacity-0');
                    appContainer.classList.add('opacity-100');
                }, 50);

            }, 500);
        }

        // 2. Animasi Perpindahan Form (Login <-> Register)
